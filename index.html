<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header>
        <h1>🎥Movie Information Site🎬</h1>
        <hr>
    </header>

    <nav>
        <a href="index.html">Homepage</a>
        <a href="movie.html">Movie Suggestions</a>
        <a href="about.html">About Us</a>

    </nav>

    <hr>
    <section id="About the Movie">
        <h2>About the Movie</h2>
        <img src="endgame.jpg" alt="Avengers">
    </section>

    <hr>

    <section id="My Favorite Movies">
        <h2>My Favorite Movies</h2>
        <table border="1px" cellpadding="10" style="margin-left: auto; margin-right: auto; width: 50%;">
            <tr style="text-align: center; color: rgb(124, 202, 220);">
                <th>Movie Title</th>
                <th>Year</th>
                <th>Rating</th>
            </tr>
            <tr>
                <td>Avengers Endgame</td>
                <td>2019</td>
                <td>8.4/10</td>
            </tr>
            <tr>
                <td>Spiderman: Brand New Day</td>
                <td>2026</td>
                <td>8.2/10</td>
            </tr>
            <tr>

            </tr>
        </table>
    </section>

    <hr>

    <section id="Watch Trailer">

        <h2>Watch Trailer</h2>
        <iframe src="https://www.youtube.com/embed/TcMBFSGVi1c?si=Qr5O0UZTlt1r1H6Q" title="Endgame Trailer"
            height="200px"></iframe>

    </section>


    <hr>

    <section id="Movie Suggestion Form">
        <h1>Movie Suggestion Form</h1>
        <form>
            <label>Your Name:</label>
            <input type="text" placeholder="Enter your name">
            <br><br>
            <label>Email:</label>
            <input type="email" placeholder="Enter your email">
            <br><br>
            <label>Favorite Movie:</label>
            <input type="text" placeholder="Avengers Endgame, Spiderman Brand New Day, etc.">
            <br><br>
            <label>Why?:</label>
            <textarea rows="5" cols="30" placeholder="Why do you reccomend this movie?"></textarea>
            <br><br>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </form>

    </section>
    <br>
    <hr>
    <br>
    <footer>
        Thank You For Visiting!
    </footer>

</body>

</html>
