<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        img {
            height: 400px;
        }
    

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #62e7ff;
            background-color: #040404;
            padding: 40px 20px;
            text-align: center;
            justify-content: center;
        }

    footer{
        text-align: center;
    }

        h1 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 20px;
            padding-bottom: 10px;
        }


        hr{
            color: white;
        }

        
    form{
        justify-content: center;
        text-align: center;
    }

    h2{
        color: white;
    }

    button{
width: 155px;
height: 40px;
border-radius: 10px;
border: solid aquamarine
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
font-size: medium;
color: black
}

    </style>


</head>

<body>
    <header>
        <h1>🎥Movie Information Site🎬</h1>
        <hr>
    </header>
    <section id="About the Movie">
        <h2>About the Movie</h2>
        <img src="movie.jpg" alt="Avengers">
    </section>

    <hr>

    <section id="My Favorite Movies">
        <h2>My Favorite Movies</h2>
        <table border="1px" cellpadding="10" style="margin-left: auto; margin-right: auto; width: 50%;">
            <tr style="text-align: center; color: rgb(124, 202, 220);">
                <th>Movie Title</th>
                <th>Year</th>
                <th>Rating</th>
            </tr>
            <tr>
                <td>Avengers Endgame</td>
                <td>2019</td>
                <td>8.4/10</td>
            </tr>
            <tr>
                <td>Spiderman: Brand New Day</td>
                <td>2026</td>
                <td>8.2/10</td>
            </tr>
            <tr>

            </tr>
        </table>
    </section>

    <hr>

    <section id="Watch Trailer">

        <h2>Watch Trailer</h2>
        <iframe src="https://www.youtube.com/embed/TcMBFSGVi1c?si=Qr5O0UZTlt1r1H6Q" title="Endgame Trailer"
            height="200px"></iframe>

    </section>


    <hr>

    <section id="Movie Suggestion Form">
        <h1>Movie Suggestion Form</h1>
        <form>
            <label>Your Name:</label>
            <input type="text" placeholder="Enter your name">
            <br><br>
            <label>Email:</label>
            <input type="email" placeholder="Enter your email">
            <br><br>
            <label>Favorite Movie:</label>
            <input type="text" placeholder="Avengers Endgame, Spiderman Brand New Day, etc.">
            <br><br>
            <label>Why?:</label>
            <textarea rows="5" cols="30" placeholder="Why do you reccomend this movie?"></textarea>
            <br><br>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </form>

    </section>
    <br>
    <hr>
    <br>
    <footer>
        Thank You For Visiting!
    </footer>

</body>

</html>
